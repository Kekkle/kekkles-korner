title: Kekkle me pink
description: Bi-monthly updates on building a nutrition education app for kids.
url: "https://kekkle.github.io"
baseurl: "/kekkles-korner"

permalink: /:year/:month/:day/:title/
timezone: Africa/Nairobi

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "Hyrox posts"
  - "Top Ten Things I did Right.md"
  - "My Hyrox Solo 5 Things.md"
  - "My Hyrox Solo 5 Things I would do differently.md"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
